<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математические головоломки</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --easy:#16a34a;
    --medium:#d97706;
    --hard:#dc2626;
    --accent:#4f46e5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#eef2ff 0%,#e0f2fe 50%,#f0fdf4 100%);
    min-height:100vh;
    color:var(--text);
    padding:24px 16px 64px;
  }
  header{max-width:900px;margin:0 auto 24px;text-align:center}
  h1{
    font-size:clamp(22px,4vw,34px);
    background:linear-gradient(90deg,#4f46e5,#0891b2);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;
  }
  .subtitle{color:var(--muted);font-size:15px}
  .filters{
    max-width:900px;margin:20px auto;display:flex;gap:8px;
    justify-content:center;flex-wrap:wrap;
  }
  .filters button{
    border:2px solid transparent;background:#fff;color:var(--muted);
    padding:8px 18px;border-radius:999px;font-size:14px;font-weight:600;
    cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:.2s;
  }
  .filters button:hover{transform:translateY(-1px)}
  .filters button.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  main{max-width:900px;margin:0 auto;display:grid;gap:16px}
  .card{
    background:var(--card);border-radius:16px;padding:20px 22px;
    box-shadow:0 2px 10px rgba(15,23,42,.07);
    border-left:5px solid var(--muted);
    transition:box-shadow .25s, transform .25s;
  }
  .card:hover{box-shadow:0 8px 24px rgba(15,23,42,.12);transform:translateY(-2px)}
  .card.easy{border-left-color:var(--easy)}
  .card.medium{border-left-color:var(--medium)}
  .card.hard{border-left-color:var(--hard)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .num{
    font-size:13px;font-weight:700;color:var(--muted);
    background:#f1f5f9;border-radius:8px;padding:3px 9px;
  }
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:999px}
  .badge.easy{background:#dcfce7;color:#15803d}
  .badge.medium{background:#fef3c7;color:#b45309}
  .badge.hard{background:#fee2e2;color:#b91c1c}
  .question{font-size:17px;line-height:1.5;margin-bottom:14px}
  .toggle{
    border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;
    padding:9px 20px;border-radius:10px;cursor:pointer;transition:.2s;
    font-family:inherit;
  }
  .toggle:hover{background:#4338ca}
  .card.open .toggle{background:#475569}
  .answer{
    max-height:0;overflow:hidden;transition:max-height .35s ease, margin-top .35s ease;
  }
  .card.open .answer{max-height:600px;margin-top:14px}
  .answer-inner{
    background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;
    padding:14px 16px;font-size:15px;line-height:1.6;
  }
  .answer-inner strong{color:var(--accent)}
  @media(max-width:520px){
    .card{padding:16px}
    .question{font-size:16px}
  }
</style>
</head>
<body>

<header>
  <h1>🧩 Математические головоломки</h1>
  <p class="subtitle">50 задач разного уровня. Попробуйте решить сами — потом проверьте решение!</p>
</header>

<div class="filters" id="filters">
  <button data-lvl="all" class="active">Все (50)</button>
  <button data-lvl="easy">Лёгкие</button>
  <button data-lvl="medium">Средние</button>
  <button data-lvl="hard">Сложные</button>
</div>

<main id="list"></main>

<script>
const LEVELS = { easy: "Лёгкая", medium: "Средняя", hard: "Сложная" };

const puzzles = [
  /* ---------- ЛЁГКИЕ ---------- */
  { lvl:"easy", q:"Сколько будет 2 + 2 × 2?",
    a:"Сначала выполняется умножение: 2 × 2 = 4, затем сложение: 2 + 4 = <b>6</b>." },

  { lvl:"easy", q:"У фермера было 17 овец. Все, кроме 8, убежали. Сколько овец осталось?",
    a:"Фраза «все, кроме 8» означает, что убежали 9, а остались <b>8</b> овец." },

  { lvl:"easy", q:"Продолжите последовательность: 2, 4, 8, 16, 32, …",
    a:"Каждое число в 2 раза больше предыдущего: 32 × 2 = <b>64</b>." },

  { lvl:"easy", q:"Сколько месяцев в году имеют 28 дней?",
    a:"В <b>каждом</b> месяце есть 28-е число. Правильный ответ — <b>12</b>." },

  { lvl:"easy", q:"На двух руках 10 пальцев. Сколько пальцев на десяти руках?",
    a:"5 рук — это 25 пальцев, значит 10 рук — <b>50</b> пальцев." },

  { lvl:"easy", q:"Кирпич весит 1 кг плюс ещё половину кирпича. Сколько весит кирпич?",
    a:"Пусть x — вес кирпича. Тогда x = 1 + x/2, откуда x/2 = 1 и x = <b>2 кг</b>." },

  { lvl:"easy", q:"Что тяжелее: килограмм ваты или килограмм железа?",
    a:"Оба весят <b>одинаково</b> — по одному килограмму. Разница только в объёме." },

  { lvl:"easy", q:"Сколько раз можно вычесть 5 из числа 25?",
    a:"Только <b>один раз</b>: после первого вычитания это будет уже 20, а не 25." },

  { lvl:"easy", q:"Утка, стоящая на двух лапах, весит 3 кг. Сколько она будет весить, если встанет на одну лапу?",
    a:"Вес не зависит от количества опор. Ответ: <b>3 кг</b>." },

  { lvl:"easy", q:"Чему равна сумма 1 + 2 + 3 + … + 10?",
    a:"Парами: (1+10) + (2+9) + (3+8) + (4+7) + (5+6) = 11 × 5 = <b>55</b>." },

  { lvl:"easy", q:"Продолжите: 1, 4, 9, 16, 25, …",
    a:"Это квадраты натуральных чисел: 1², 2², 3², 4², 5². Следующее — 6² = <b>36</b>." },

  { lvl:"easy", q:"У отца 5 сыновей, и у каждого есть сестра. Сколько всего детей в семье?",
    a:"Сестра у всех одна и та же. Значит, 5 сыновей + 1 дочь = <b>6 детей</b>." },

  { lvl:"easy", q:"Сколько концов у трёх с половиной палок?",
    a:"3 палки — 6 концов, половина палки — 2 конца. Итого <b>8 концов</b>." },

  { lvl:"easy", q:"Три курицы за три дня снесли три яйца. Сколько яиц снесут шесть куриц за шесть дней?",
    a:"Одна курица за 3 дня несёт 1 яйцо. За 6 дней — 2 яйца. Шесть куриц за 6 дней снесут 6 × 2 = <b>12 яиц</b>." },

  { lvl:"easy", q:"Горело 7 свечей, 2 погасли. Сколько свечей осталось?",
    a:"Оставшиеся 5 сгорели дотла. Остались только <b>2 погасшие</b> свечи." },

  { lvl:"easy", q:"В корзине 5 яблок. Как раздать их пятерым детям, чтобы одно яблоко осталось в корзине?",
    a:"Четверым дать по яблоку, а пятому отдать яблоко <b>вместе с корзиной</b>." },

  { lvl:"easy", q:"Сколько раз цифра 9 встречается при записи чисел от 1 до 100?",
    a:"В разряде единиц — 10 раз (9, 19, …, 99), в разряде десятков — тоже 10 раз (90–99). Итого <b>20 раз</b>." },

  { lvl:"easy", q:"Продолжите: 1, 1, 2, 3, 5, 8, …",
    a:"Числа Фибоначчи: каждое равно сумме двух предыдущих. 5 + 8 = <b>13</b>." },

  /* ---------- СРЕДНИЕ ---------- */
  { lvl:"medium", q:"Отцу 40 лет, сыну 10. Через сколько лет отец будет ровно вдвое старше сына?",
    a:"40 + x = 2(10 + x) → 40 + x = 20 + 2x → x = <b>20 лет</b>." },

  { lvl:"medium", q:"Улитка ползёт по столбу высотой 10 м. Днём она поднимается на 3 м, ночью сползает на 2 м. За сколько дней она доберётся до вершины?",
    a:"За сутки улитка поднимается на 1 м. За 7 суток — на 7 м. На 8-й день она проползёт ещё 3 м и окажется на вершине. Ответ: <b>8 дней</b>." },

  { lvl:"medium", q:"Между городами 200 км. Навстречу друг другу выехали два поезда со скоростями 60 км/ч и 40 км/ч. Через сколько часов они встретятся?",
    a:"Скорость сближения 60 + 40 = 100 км/ч. Время: 200 / 100 = <b>2 часа</b>." },

  { lvl:"medium", q:"Первая труба наполняет бассейн за 6 часов, вторая — за 12 часов. За сколько часов наполнят бассейн обе трубы вместе?",
    a:"За час: 1/6 + 1/12 = 3/12 = 1/4 бассейна. Значит, весь бассейн — за <b>4 часа</b>." },

  { lvl:"medium", q:"Сколько чисел от 1 до 100 делятся на 3 или на 5?",
    a:"На 3: 33 числа, на 5: 20 чисел, на 15 (оба условия): 6 чисел. По формуле включений-исключений: 33 + 20 − 6 = <b>47</b>." },

  { lvl:"medium", q:"В тёмной комнате лежат 10 пар чёрных и 10 пар белых носков. Сколько носков нужно взять наугад, чтобы гарантированно получить пару одного цвета?",
    a:"Цветов всего два, значит по принципу Дирихле <b>3 носка</b> всегда дадут пару одного цвета." },

  { lvl:"medium", q:"Сколько раз цифра 1 встречается при записи чисел от 1 до 100?",
    a:"В разряде единиц — 10 раз (1, 11, 21, …, 91), в разряде десятков — 10 раз (10–19), плюс число 100. Итого <b>21 раз</b>." },

  { lvl:"medium", q:"Два кота за две минуты ловят двух мышей. Сколько котов поймают 100 мышей за 100 минут?",
    a:"Один кот за 2 минуты ловит 1 мышь, значит за 100 минут — 50 мышей. Чтобы поймать 100 мышей за 100 минут, нужно <b>2 кота</b>." },

  { lvl:"medium", q:"Сумма трёх последовательных натуральных чисел равна 72. Найдите эти числа.",
    a:"Среднее число = 72 / 3 = 24. Ответ: <b>23, 24, 25</b>." },

  { lvl:"medium", q:"Периметр квадрата равен 20 см. Чему равна его площадь?",
    a:"Сторона = 20 / 4 = 5 см. Площадь = 5² = <b>25 см²</b>." },

  { lvl:"medium", q:"Часы бьют 6 раз за 5 секунд. За сколько секунд они пробьют 12 раз?",
    a:"6 ударов — это 5 промежутков, значит 1 промежуток = 1 с. 12 ударов — 11 промежутков = <b>11 секунд</b>." },

  { lvl:"medium", q:"Сколько литров воды в одном кубическом метре?",
    a:"1 м³ = 100 × 100 × 100 см³ = 1 000 000 см³ = <b>1000 литров</b>." },

  { lvl:"medium", q:"Поезд длиной 100 м проезжает мимо столба за 10 секунд. Какова его скорость в км/ч?",
    a:"Скорость = 100 м / 10 с = 10 м/с. В км/ч: 10 × 3,6 = <b>36 км/ч</b>." },

  { lvl:"medium", q:"Мать втрое старше дочери, а через 12 лет будет вдвое старше. Сколько лет каждой сейчас?",
    a:"Пусть дочери x лет. 3x + 12 = 2(x + 12) → 3x + 12 = 2x + 24 → x = 12. Дочь — <b>12 лет</b>, мать — <b>36 лет</b>." },

  { lvl:"medium", q:"Сколько раз в сутки часовая и минутная стрелки совпадают?",
    a:"За 12 часов стрелки совпадают 11 раз (а не 12 — из-за движения часовой стрелки). За сутки: 11 × 2 = <b>22 раза</b>." },

  { lvl:"medium", q:"Сколько составляет 15% от 200?",
    a:"15% = 0,15. 0,15 × 200 = <b>30</b>." },

  { lvl:"medium", q:"Пять человек обменялись рукопожатиями, каждый с каждым по одному разу. Сколько всего было рукопожатий?",
    a:"Каждая пара — одно рукопожатие: C(5,2) = 5 × 4 / 2 = <b>10</b>." },

  /* ---------- СЛОЖНЫЕ ---------- */
  { lvl:"hard", q:"Известно, что a + b = 5 и a · b = 6. Найдите a² + b².",
    a:"a² + b² = (a + b)² − 2ab = 25 − 12 = <b>13</b>." },

  { lvl:"hard", q:"Найдите наименьшее натуральное число, которое при делении на 2, 3, 4, 5 и 6 даёт в остатке 1, а на 7 делится без остатка.",
    a:"Число вида НОК(2,3,4,5,6)·k + 1 = 60k + 1. Проверяем: 61 не делится на 7, а 60·5 + 1 = <b>301</b> = 7 × 43. Ответ: 301." },

  { lvl:"hard", q:"Сколько нулей на конце числа 100! (100 факториал)?",
    a:"Нули дают множители 5. Считаем: ⌊100/5⌋ + ⌊100/25⌋ = 20 + 4 = <b>24 нуля</b>." },

  { lvl:"hard", q:"Сколько диагоналей у правильного 12-угольника?",
    a:"Формула n(n − 3)/2 = 12 × 9 / 2 = <b>54 диагонали</b>." },

  { lvl:"hard", q:"Вычислите сумму: 1/(1·2) + 1/(2·3) + 1/(3·4) + … + 1/(99·100).",
    a:"Каждое слагаемое 1/(n(n+1)) = 1/n − 1/(n+1). Сумма телескопируется: 1 − 1/100 = <b>99/100</b>." },

  { lvl:"hard", q:"Сколько существует четырёхзначных чисел, в записи которых есть хотя бы одна цифра 7?",
    a:"Всего четырёхзначных чисел 9000. Без семёрки: 8 × 9 × 9 × 9 = 5832. Значит, с семёркой: 9000 − 5832 = <b>3168</b>." },

  { lvl:"hard", q:"Бросают два игральных кубика. Какова вероятность, что сумма очков равна 7?",
    a:"Всего исходов 6 × 6 = 36. Благоприятных (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) — 6. Вероятность 6/36 = <b>1/6</b>." },

  { lvl:"hard", q:"Решите уравнение: 2ˣ = 8ˣ⁻¹.",
    a:"8 = 2³, поэтому 2ˣ = 2³⁽ˣ⁻¹⁾. Значит x = 3x − 3, откуда 2x = 3 и x = <b>1,5</b>." },

  { lvl:"hard", q:"Сколько раз цифра 5 встречается при записи всех чисел от 1 до 1000?",
    a:"В каждом разряде (единицы, десятки, сотни) пятёрка встречается 100 раз. Итого 100 × 3 = <b>300 раз</b>." },

  { lvl:"hard", q:"Известно, что x + 1/x = 3. Найдите x² + 1/x².",
    a:"Возводим в квадрат: (x + 1/x)² = x² + 2 + 1/x² = 9. Значит x² + 1/x² = 9 − 2 = <b>7</b>." },

  { lvl:"hard", q:"Сколько всего прямоугольников (включая квадраты) можно найти на шахматной доске 8×8?",
    a:"Прямоугольник задаётся выбором 2 вертикальных и 2 горизонтальных линий из 9: C(9,2) · C(9,2) = 36 × 36 = <b>1296</b>." },

  { lvl:"hard", q:"На какое максимальное число частей можно разрезать круг десятью прямыми разрезами?",
    a:"Формула максимума частей: 1 + n(n+1)/2. При n = 10: 1 + 55 = <b>56 частей</b>." },

  { lvl:"hard", q:"Какой цифрой оканчивается число 3²⁰²⁴?",
    a:"Последние цифры степеней тройки образуют цикл 3, 9, 7, 1 (период 4). 2024 делится на 4, значит берём последний элемент цикла: <b>1</b>." },

  { lvl:"hard", q:"Сколькими способами можно разменять 10 рублей монетами по 1, 2 и 5 рублей?",
    a:"Решаем a + 2b + 5c = 10. При c = 0: 6 решений; c = 1: 3 решения; c = 2: 1 решение. Итого 6 + 3 + 1 = <b>10 способов</b>." },

  { lvl:"hard", q:"В шахматном турнире каждый сыграл с каждым по одному разу. Всего было 45 партий. Сколько было участников?",
    a:"n(n − 1)/2 = 45 → n(n − 1) = 90 → n = <b>10 участников</b>." }
];

const state = { filter: "all" };
const listEl = document.getElementById("list");

function render() {
  listEl.innerHTML = "";
  let shown = 0;

  puzzles.forEach((p, i) => {
    if (state.filter !== "all" && p.lvl !== state.filter) return;
    shown++;

    const card = document.createElement("article");
    card.className = "card " + p.lvl;
    card.innerHTML = `
      <div class="card-head">
        <span class="num">№ ${i + 1}</span>
        <span class="badge ${p.lvl}">${LEVELS[p.lvl]}</span>
      </div>
      <p class="question">${p.q}</p>
      <button class="toggle" type="button">Ответ</button>
      <div class="answer">
        <div class="answer-inner"><strong>Решение:</strong> ${p.a}</div>
      </div>
    `;

    const btn = card.querySelector(".toggle");
    btn.addEventListener("click", () => {
      const open = card.classList.toggle("open");
      btn.textContent = open ? "Скрыть решение" : "Ответ";
    });

    listEl.appendChild(card);
  });

  if (shown === 0) {
    listEl.innerHTML = '<p style="text-align:center;color:#64748b">Здесь пока пусто 🙃</p>';
  }
}

document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.filter = btn.dataset.lvl;
  render();
});

render();
</script>
</body>
</html>
